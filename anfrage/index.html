<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fotoanfrage an MAPQ senden">
  <meta name="color-scheme" content="dark">
  <title>Anfrage — MAPQ Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23050b12%22/%3E%3Cpath d=%22M15 45V21h7l10 13 10-13h7v24h-8V33l-9 11-9-11v12Z%22 fill=%22%2328a9ff%22/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --background: #050b12;
      --surface: #0b1521;
      --surface-hover: #10253d;
      --text: #f3f8ff;
      --muted: #8fa6bd;
      --line: #284661;
      --blue: #28a9ff;
      --blue-strong: #145eff;
      --error: #ff8c9b;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 82% 12%, rgba(20, 94, 255, .22), transparent 32rem),
        radial-gradient(circle at 12% 86%, rgba(40, 169, 255, .12), transparent 30rem),
        var(--background);
      color: var(--text);
      font-family: Manrope, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.55;
    }
    a { color: inherit; }
    a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 4px;
    }
    .nav {
      min-height: 5.125rem;
      padding: 1rem 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      border-bottom: 1px solid #17334c;
    }
    .brand {
      color: var(--blue);
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.08em;
    }
    .back {
      color: var(--muted);
      text-decoration: none;
      font-family: "DM Mono", monospace;
      font-size: .875rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .back:hover { color: var(--blue); }
    main {
      width: min(72rem, calc(100% - 10vw));
      margin-inline: auto;
      padding: clamp(3.5rem, 8vw, 7rem) 0;
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(22rem, 1.1fr);
      gap: clamp(3rem, 8vw, 8rem);
      align-items: start;
    }
    .eyebrow {
      margin: 0 0 1.3rem;
      color: var(--blue);
      font-family: "DM Mono", monospace;
      font-size: .875rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 8vw, 7.5rem);
      line-height: .85;
      letter-spacing: -.09em;
    }
    .intro {
      max-width: 28rem;
      margin: 2rem 0 0;
      color: var(--muted);
      font-size: 1.0625rem;
    }
    .contact-form {
      padding: clamp(1.5rem, 4vw, 2.75rem);
      background: rgba(11, 21, 33, .9);
      border: 1px solid var(--line);
      box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .3);
    }
    .field { margin-bottom: 1.5rem; }
    label {
      display: block;
      margin-bottom: .55rem;
      font-family: "DM Mono", monospace;
      font-size: .875rem;
      color: #c7dcf2;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0;
      padding: .95rem 1rem;
      background: var(--background);
      color: var(--text);
      font: inherit;
      transition: border-color .2s ease, background .2s ease;
    }
    input:hover, select:hover, textarea:hover { border-color: var(--blue); }
    input:focus, select:focus, textarea:focus { background: var(--surface-hover); }
    select { cursor: pointer; }
    option { background: var(--surface); color: var(--text); }
    textarea { min-height: 11rem; resize: vertical; }
    ::placeholder { color: #71879d; opacity: 1; }
    .submit {
      width: 100%;
      min-height: 3.6rem;
      border: 0;
      padding: .9rem 1.25rem;
      background: var(--blue-strong);
      color: white;
      font: 700 1rem Manrope, Arial, sans-serif;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .submit:hover { background: var(--blue); }
    .submit:active { transform: translateY(1px); }
    .note {
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: .875rem;
    }
    .status {
      min-height: 1.5rem;
      margin: .75rem 0 0;
      color: var(--error);
      font-size: .875rem;
    }
    @media (max-width: 760px) {
      .nav { min-height: 4.25rem; }
      main {
        width: calc(100% - 2.5rem);
        grid-template-columns: 1fr;
        padding: 3.5rem 0;
      }
      h1 { font-size: clamp(3.75rem, 17vw, 6rem); }
      .contact-form { padding: 1.25rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
  <link rel="stylesheet" href="../highlights/site-features.css?v=1">
  <script defer src="../highlights/site-features.js?v=1"></script>
</head>
<body>
  <nav class="nav" aria-label="Navigation">
    <a class="brand" href="/">MAPQ</a>
    <a class="back" href="/">← Zurück zur Startseite</a>
  </nav>

  <main>
    <section aria-labelledby="page-title">
      <p class="eyebrow">Fotoanfrage / Tirol</p>
      <h1 id="page-title">DEINE<br>IDEE.<br>MEIN<br>FRAME.</h1>
      <p class="intro">Erzähl mir kurz, was du fotografieren lassen möchtest. Beim Senden öffnet sich dein E-Mail-Programm mit der fertigen Anfrage.</p>
    </section>

    <form class="contact-form" id="contact-form">
      <div class="field">
        <label for="email">Deine E-Mail-Adresse</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="name@beispiel.at" required>
      </div>

      <div class="field">
        <label for="subject">Was soll fotografiert werden?</label>
        <select id="subject" name="subject" required>
          <option value="" selected disabled>Bitte auswählen</option>
          <option value="Auto">Auto</option>
          <option value="Motorrad">Motorrad</option>
          <option value="Porträt">Porträt</option>
          <option value="Event">Event</option>
          <option value="Outdoor oder Natur">Outdoor oder Natur</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Deine Nachricht</label>
        <textarea id="message" name="message" placeholder="Beschreibe deine Idee, den Ort und einen möglichen Termin" maxlength="3000" required></textarea>
      </div>

      <button class="submit" type="submit">Anfrage senden →</button>
      <p class="note">Deine Angaben werden nicht auf dieser Website gespeichert.</p>
      <p class="status" id="status" aria-live="polite"></p>
      <noscript><p class="note">Bitte sende deine Anfrage direkt an Matteohanser8@gmail.com.</p></noscript>
    </form>
  </main>

  <script>
    const form = document.getElementById("contact-form");
    const status = document.getElementById("status");

    form.addEventListener("submit", event => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const email = document.getElementById("email").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!email || !subject || !message) {
        status.textContent = "Bitte fülle alle Felder aus.";
        return;
      }

      const mailSubject = `Fotoanfrage: ${subject}`;
      const mailBody = `E-Mail-Adresse: ${email}\n\nWas soll fotografiert werden?\n${subject}\n\nNachricht:\n${message}`;
      const mailto = `mailto:Matteohanser8@gmail.com?subject=${encodeURIComponent(mailSubject)}&body=${encodeURIComponent(mailBody)}`;

      status.textContent = "Dein E-Mail-Programm wird geöffnet.";
      window.location.href = mailto;
    });
  </script>
</body>
</html>
