:root{
  color-scheme:dark;
  --black:#08080a;
  --black-2:#121215;
  --line:#26272b;
  --chrome:#ebebed;
  --mute:#8e9095;
  --f-d:"Michroma","Arial Black",Arial,sans-serif;
  --f:"Figtree","Helvetica Neue",Arial,sans-serif;
  --gl:max(clamp(16px,3.6vw,52px),env(safe-area-inset-left,0px));
  --gr:max(clamp(16px,3.6vw,52px),env(safe-area-inset-right,0px));
  --chrome-grad:linear-gradient(176deg,#ffffff 0%,#cfd1d5 26%,#55585e 47%,#1f2023 51%,#dfe0e3 60%,#8c8f95 80%,#f4f4f5 100%);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;background:var(--black);color:var(--chrome);font:400 1.0625rem/1.6 var(--f);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
p{margin:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--chrome);outline-offset:3px}
[hidden]{display:none!important}
::selection{background:var(--chrome);color:var(--black)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-stopped{overflow:hidden}
h1,h2,h3{margin:0;font-family:var(--f-d);font-weight:400;letter-spacing:-.01em;line-height:1.05;text-wrap:balance}
h2{font-size:clamp(1.8rem,4.2vw,3rem)}
h3{font-size:1.15rem}
.chrome{background:var(--chrome-grad);background-size:100% 240%;background-position:0 var(--sy,38%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mute{color:var(--mute)}
.in{max-width:1360px;margin-inline:auto;padding-left:var(--gl);padding-right:var(--gr)}
.top{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:calc(16px + env(safe-area-inset-top,0px)) var(--gr) 16px var(--gl);transition:background .3s,border-color .3s;border-bottom:1px solid transparent}

.mk{font:400 .95rem/1 var(--f-d);text-decoration:none}

@media (max-width:640px){.nav .opt{display:none}}
.btn{display:inline-flex;align-items:center;gap:.6rem;min-height:46px;padding:0 1.3rem;border:0;border-radius:999px;background:var(--chrome);color:var(--black);font:700 .95rem/1 var(--f);text-decoration:none;cursor:pointer;transition:background .2s}
.btn:hover{background:#fff}
.btn.line{background:transparent;color:var(--chrome);box-shadow:inset 0 0 0 1px rgba(235,235,237,.5)}
.btn.line:hover{box-shadow:inset 0 0 0 1px var(--chrome);background:rgba(255,255,255,.06)}
.acts{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:center}
.ul{background:none;border:0;padding:0;cursor:pointer;font:600 .95rem/1.3 var(--f);color:var(--chrome);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}

.dlg{position:fixed;inset:0;z-index:62;display:grid;place-items:center;padding:16px;background:rgba(8,8,10,.85)}
.dlg .box{position:relative;width:min(500px,100%);padding:1.75rem;background:var(--black-2);border:1px solid var(--line);border-radius:16px}
.dlg h2{font-size:1.4rem;margin-bottom:1rem}
.dlg .x{position:absolute;right:1.25rem;top:1.4rem;background:none;border:0;cursor:pointer;color:var(--mute);font:600 .9rem/1 var(--f)}
dl{margin:0;border-top:1px solid var(--line)}
dl div{display:flex;justify-content:space-between;gap:1rem;padding:.85rem 0;border-bottom:1px solid var(--line)}
dt{color:var(--mute)}
dd{margin:0;font-weight:700;text-align:right}
/* Karten mit 3D-Kippen und Chrom-Glanz */
.card{position:relative;display:block;width:100%;padding:0;border:0;background:var(--black-2);cursor:zoom-in;border-radius:6px;overflow:hidden;transform-style:preserve-3d;text-decoration:none;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .25s ease-out,opacity .3s,box-shadow .25s;box-shadow:0 16px 36px rgba(0,0,0,.45)}

.card .gl{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;mix-blend-mode:overlay;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.8),rgba(255,255,255,0) 45%),linear-gradient(115deg,transparent 32%,rgba(255,255,255,.28) 48%,transparent 62%)}

.card .cap b{font:700 .92rem/1.25 var(--f)}
.card .cap small{color:#c2c3c7;font-size:.78rem;white-space:nowrap}
.card:hover img,.card:focus-visible img{filter:none}

.card:hover{box-shadow:0 30px 60px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.head{padding-top:calc(110px + env(safe-area-inset-top,0px));padding-bottom:2rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1.25rem 2rem}
.head h1{font-size:clamp(2.4rem,7vw,5.6rem);line-height:1}
.head p{margin-top:.6rem}
.filters{display:flex;flex-wrap:wrap;gap:.4rem}
.filters button{min-height:40px;padding:0 1rem;border:1px solid var(--line);border-radius:999px;background:none;color:var(--mute);cursor:pointer;font:600 .9rem/1 var(--f)}

.filters button:hover{color:var(--chrome);border-color:#45474c}

.wall{columns:4 260px;column-gap:clamp(10px,1.4vw,18px);padding-bottom:5rem;perspective:1400px}
.wall .card{margin-bottom:clamp(10px,1.4vw,18px);break-inside:avoid}
.wall .card img{aspect-ratio:var(--ar);height:auto}
.wall .card.off{display:none}
/* Großansicht als eigene Bild-Ansicht mit Link */
.lb{position:fixed;inset:0;z-index:60;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1rem;
  padding:calc(16px + env(safe-area-inset-top,0px)) var(--gr) calc(18px + env(safe-area-inset-bottom,0px)) var(--gl);background:rgba(6,6,8,.97);perspective:1600px}
.lbtop{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.lbtop span{font:400 .85rem/1 var(--f-d)}
.lbtop button{background:none;border:0;cursor:pointer;color:var(--mute);font:600 .95rem/1 var(--f);padding:.5rem 0}
.lbtop button:hover{color:var(--chrome)}
.stagebox{min-height:0;display:flex;align-items:center;justify-content:center}
.stagebox img{max-width:min(94vw,1200px);max-height:100%;width:auto;height:auto;border-radius:4px;box-shadow:0 40px 90px rgba(0,0,0,.7);transition:transform .2s ease-out}
.stagebox img.in3d{animation:fl .7s cubic-bezier(.2,.8,.2,1)}
@keyframes fl{from{opacity:0;transform:rotateY(var(--from,-35deg)) scale(.88)}}
.lbbar{display:flex;align-items:center;justify-content:space-between;gap:1rem 2rem;flex-wrap:wrap}
.lbcap{display:flex;gap:.4rem 1rem;align-items:baseline;flex-wrap:wrap}
.lbcap b{font-weight:700;font-size:1.1rem}
.lbcap small{color:var(--mute);font-variant-numeric:tabular-nums}
.lbnav{display:flex;gap:.6rem;align-items:center}
.lbnav button{width:46px;height:46px;border-radius:50%;border:0;background:var(--black-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--chrome);cursor:pointer;font-size:1.2rem}
.lbnav button:hover{background:var(--chrome);color:var(--black)}
.lbnav .cp{width:auto;border-radius:999px;padding:0 1rem;font:600 .88rem/1 var(--f)}

  }
  function step(d){ var l=list(), i=l.indexOf(cur), n=l[(i+d+l.length)%l.length]; render(n,d); try{ history.replaceState({b:slug(n)},"","#"+slug(n)); }catch(e){} }
  function close(fromPop){
    if(lb.hidden) return;
    lb.hidden=true; document.body.style.overflow=""; if(MQ.lenis) MQ.lenis.start(); document.title="Bilder – mapq.raw";
    if(!fromPop){ try{ if(pushed){ pushed=false; history.back(); } else history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
    if(opener&&opener.focus) opener.focus();
    else if(cur){ var c=cards.filter(function(x){ return x.it===cur; })[0]; if(c) c.el.focus(); }
  }
  $("#lbx").addEventListener("click",function(){ close(false); });
  $("#lbp").addEventListener("click",function(){ step(-1); });
  $("#lbn").addEventListener("click",function(){ step(1); });
  $("#lbcp").addEventListener("click",function(){
    var b=$("#lbcp"), url=location.href;
    function ok(){ b.textContent="Link kopiert"; setTimeout(function(){ b.textContent="Link kopieren"; },1800); }
    try{ navigator.clipboard.writeText(url).then(ok,function(){}); }catch(e){}
  });
  lb.addEventListener("click",function(e){ if(e.target===lb||e.target.classList.contains("stagebox")) close(false); });
  lb.addEventListener("pointerdown",function(e){ sx=e.clientX; });
  lb.addEventListener("pointerup",function(e){ if(sx===null) return; var d=e.clientX-sx; sx=null; if(Math.abs(d)>60) step(d<0?1:-1); });
  if(MQ.fine&&!reduce) lb.addEventListener("pointermove",function(e){ var x=e.clientX/innerWidth-.5, y=e.clientY/innerHeight-.5; lbi.style.transform="rotateY("+(x*9).toFixed(2)+"deg) rotateX("+(-y*6).toFixed(2)+"deg)"; });
  document.addEventListener("keydown",function(e){
    if(lb.hidden) return;
    if(e.key==="Escape") close(false); else if(e.key==="ArrowLeft") step(-1); else if(e.key==="ArrowRight") step(1);
  });
  function fromHash(){ var s=decodeURIComponent((location.hash||"").slice(1)); if(s&&find(s)) open(s,false); else close(true); }
  window.addEventListener("popstate",function(){ pushed=false; fromHash(); });
  window.addEventListener("hashchange",fromHash);
  fromHash();
})();

</script>
</body>
