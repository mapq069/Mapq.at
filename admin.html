<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Admin · mapq.raw</title>
<link rel="manifest" href="admin-manifest.json">
<link rel="apple-touch-icon" href="admin-icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mapq Admin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23FAFAFA' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Grotesk:wght@300..700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
<style>
/* Admin für mapq.at – Gestaltung nach design-system/mapq-raw/MASTER.md:
   reines Schwarz-Weiß, Archivo für Überschriften, Space Grotesk für Text. */
:root{
  color-scheme:dark;
  --bg:#000000;
  --card:#0C0C0C;
  --muted-bg:#181818;
  --line:#232327;
  --line-2:#3F3F46;
  --text:#FAFAFA;
  --muted:#94A3B8;
  --dim:#71717A;
  --accent:#F8FAFC;
  --on-accent:#0F172A;
  --ok:#4ADE80;
  --warn:#FBBF24;
  --bad:#EF4444;
  --r-btn:8px;--r-card:12px;--r-modal:16px;
  --ease:200ms ease;
  --font-h:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-b:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --shadow-xl:0 20px 25px rgba(0,0,0,.15);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg);scroll-padding-top:80px;scroll-padding-bottom:150px}
@media(min-width:960px){html{scroll-padding-bottom:110px}}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--font-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
a,button,label,summary,select{cursor:pointer}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--on-accent)}
code{font-size:.88em;background:var(--muted-bg);padding:1px 6px;border-radius:5px}
.ic{flex:none;display:block}
.ic.fill{fill:currentColor}
.muted{color:var(--muted)}
.display{font-family:var(--font-h);font-stretch:62%;font-weight:850;line-height:.9;text-transform:uppercase;letter-spacing:-.01em}
.label{font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.kicker{display:flex;align-items:center;gap:.55rem;color:var(--muted)}
.kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text)}
.logo{font-family:var(--font-h);font-stretch:75%;font-weight:800;font-size:20px;letter-spacing:.01em;text-decoration:none}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100dvh}
.app>div{min-width:0}
@media(min-width:960px){.app{grid-template-columns:240px minmax(0,1fr)}}
.sidebar{display:none}
@media(min-width:960px){.sidebar{display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100dvh;padding:22px 14px;border-right:1px solid var(--line)}}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px}
.brand .tag{font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:3px 6px;line-height:1}
.snav{display:flex;flex-direction:column;gap:2px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:var(--r-btn);background:none;color:var(--muted);font-size:14.5px;font-weight:500;text-align:left;transition:background var(--ease),color var(--ease)}
.sitem:hover{background:var(--muted-bg);color:var(--text)}
.sitem.active{background:var(--accent);color:var(--on-accent);font-weight:600}
.count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--text);color:#000;font-size:11px;font-weight:700;display:grid;place-items:center}
.sitem.active .count{background:#000;color:#fff}
.sfoot{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 8px}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:calc(60px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;background:rgba(0,0,0,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .spacer{flex:1}
@media(max-width:959px){#pubBtn{padding:0 13px}}
@media(max-width:350px){#pubBtn span{display:none}#pubBtn{width:44px;padding:0}}
@media(min-width:960px){.topbar{padding:0 32px;height:64px}}
.only-mobile{display:inline-flex}
@media(min-width:960px){.only-mobile{display:none!important}}
.only-desk{display:none!important}
@media(min-width:960px){.only-desk{display:inline-flex!important}}
main{width:100%;max-width:1120px;margin:0 auto;padding:20px 16px calc(160px + env(safe-area-inset-bottom))}
@media(min-width:960px){main{padding:32px 32px 140px}}

.tabbar{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(0,0,0,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
@media(min-width:960px){.tabbar{display:none}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;background:none;border:0;color:var(--dim);font-size:10.5px;font-weight:500;position:relative;-webkit-tap-highlight-color:transparent;transition:color var(--ease)}
.tab.active{color:var(--text)}
.tab.active::before{content:"";position:absolute;top:-4px;left:28%;right:28%;height:2px;background:var(--text);border-radius:0 0 2px 2px}
.tab .count{position:absolute;top:3px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;font-size:9.5px}

/* ---------- Bausteine ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid var(--line-2);background:transparent;color:var(--text);font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;-webkit-tap-highlight-color:transparent;flex:none;transition:border-color var(--ease),background var(--ease),opacity var(--ease),transform var(--ease)}
.btn:hover{border-color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;gap:6px}
.btn.icon{width:44px;padding:0}
.btn.sm.icon{width:36px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{opacity:.9;border-color:var(--accent)}
.btn-danger{color:#fca5a5;border-color:rgba(239,68,68,.4)}
.btn-danger:hover{border-color:var(--bad);background:rgba(239,68,68,.08)}
.btn[disabled]{opacity:.35;pointer-events:none}
.ping{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(248,250,252,.5)}70%{box-shadow:0 0 0 10px rgba(248,250,252,0)}100%{box-shadow:0 0 0 0 rgba(248,250,252,0)}}
@media(max-width:420px){.hide-xs{display:none}}
@media(max-width:600px){.hide-sm{display:none}}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px}
@media(min-width:760px){.card{padding:22px}}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field>label,.flabel{font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field small,.hint{color:var(--dim);font-size:12.5px;line-height:1.45}
.input{width:100%;min-height:46px;background:#050505;border:1px solid var(--line-2);border-radius:var(--r-btn);color:var(--text);padding:11px 14px;font-size:16px;outline:none;transition:border-color var(--ease),box-shadow var(--ease);-webkit-appearance:none;appearance:none}
.input::placeholder{color:var(--dim)}
.input:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
textarea.input{resize:vertical;min-height:90px;line-height:1.5}
input[type=date].input{min-height:46px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.pass-wrap{position:relative}
.pass-wrap .input{padding-right:52px}
.pass-wrap .btn{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0}
.grid2{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;align-items:center}
.row>.input{flex:1;min-width:0}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.seg.scroll::-webkit-scrollbar{display:none}
@media(min-width:960px){.seg.scroll{margin:0;padding:0;flex-wrap:wrap}}
.seg-b{flex:none;min-height:40px;padding:0 14px;border-radius:var(--r-btn);border:1px solid var(--line-2);background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;white-space:nowrap;transition:all var(--ease)}
.seg-b:hover{color:var(--text);border-color:var(--muted)}
.seg-b.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.seg-b .n{opacity:.6;margin-left:6px;font-variant-numeric:tabular-nums}
.seg-b{display:inline-flex;align-items:center;gap:7px}
.seg-b.add::before{content:"+ ";opacity:.6}
.seg-b.add.on::before{content:"✓ ";opacity:1}

.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.chip.ok{color:var(--ok);border-color:rgba(74,222,128,.35)}.chip.ok::before{background:var(--ok)}
.chip.warn{color:var(--warn);border-color:rgba(251,191,36,.35)}.chip.warn::before{background:var(--warn)}
.chip.bad{color:#fca5a5;border-color:rgba(239,68,68,.4)}.chip.bad::before{background:var(--bad)}
.chip.white{color:var(--text);border-color:var(--text)}.chip.white::before{background:var(--text)}

.switch{-webkit-appearance:none;appearance:none;flex:none;width:48px;height:28px;border-radius:999px;background:var(--muted-bg);border:1px solid var(--line-2);position:relative;margin:0;transition:background var(--ease),border-color var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform 220ms cubic-bezier(.3,.7,.3,1.2),background var(--ease)}
.switch:checked{background:var(--accent);border-color:var(--accent)}
.switch:checked::after{transform:translateX(20px);background:#000}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 14px;border:1px solid var(--line-2);border-radius:var(--r-btn);margin-bottom:16px;transition:border-color var(--ease)}
.switch-row:hover{border-color:var(--muted)}
.switch-row b{display:block;font-weight:600;font-size:14.5px}
.switch-row small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* ---------- Seitenkopf ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:4px 0 24px;flex-wrap:wrap}
.ph h1{margin:10px 0 0;font-size:clamp(3rem,13vw,5.2rem);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.ph>div{min-width:0}
.ph p{margin:10px 0 0;color:var(--muted);font-size:14.5px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}

.banner{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border-radius:var(--r-card);margin-bottom:20px;border:1px solid var(--line-2);background:var(--card)}
.banner>.ic{margin-top:2px;color:var(--text)}
.banner b{display:block;font-weight:600;margin-bottom:2px}
.banner p{margin:0;color:var(--muted);font-size:13.5px}
.banner .btn{margin-top:12px}
.banner.bad{border-color:rgba(239,68,68,.45)}.banner.bad>.ic{color:var(--bad)}
.banner.warn{border-color:rgba(251,191,36,.4)}.banner.warn>.ic{color:var(--warn)}

/* ---------- Übersicht ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r-card);overflow:hidden;margin-bottom:16px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--bg);border:0;padding:16px 16px 18px;text-align:left;transition:background var(--ease)}
.stat:hover{background:var(--card)}
.stat .label{color:var(--muted);display:flex;align-items:center;gap:8px}
.stat b{display:block;font-family:var(--font-h);font-stretch:62%;font-weight:850;font-size:clamp(2.6rem,9vw,3.6rem);line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}
.stat span.sub{display:block;color:var(--muted);font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.hot{background:var(--accent);color:var(--on-accent)}
.stat.hot .label,.stat.hot span.sub{color:#334155}
.dgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.dgrid{grid-template-columns:1.25fr 1fr}}
.card h2,.sec-title{margin:0;font-family:var(--font-h);font-stretch:75%;font-weight:750;font-size:22px;line-height:1.1;display:flex;align-items:center;gap:10px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:12px;font-size:14px}
.bar-row .track{height:6px;border-radius:3px;background:var(--muted-bg);overflow:hidden}
.bar-row .track i{display:block;height:100%;background:var(--text);border-radius:3px}
.bar-row .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.mini-list{display:flex;flex-direction:column}
.mini{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.mini:first-child{border-top:0;padding-top:0}
.mini .t{flex:1;min-width:0}
.mini .t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.qa{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;min-height:92px;padding:14px;border:1px solid var(--line-2);border-radius:var(--r-btn);background:none;font-size:13.5px;font-weight:600;text-align:left;text-decoration:none;transition:border-color var(--ease)}
.qa:hover{border-color:var(--text)}
.empty-mini{color:var(--muted);font-size:14px}

/* ---------- Fotos ---------- */
.toolbar{margin-bottom:16px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:600px){.pgrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}}
.ptile{position:relative;aspect-ratio:3/4;border-radius:var(--r-btn);overflow:hidden;background:var(--muted-bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform var(--ease)}
.ptile img{width:100%;height:100%;object-fit:cover;display:block;transition:filter var(--ease)}
@media(hover:hover){.ptile:hover{transform:translateY(-2px)}.ptile:hover img{filter:brightness(1.08)}}
.ptile::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}
.pbadges{position:absolute;top:6px;left:6px;right:6px;z-index:1;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.pb{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:rgba(0,0,0,.65);color:#fff;line-height:1}
.pb.w{background:var(--accent);color:var(--on-accent)}
.pstar{position:absolute;top:6px;right:6px;z-index:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#000}
.pcat{position:absolute;left:8px;right:8px;bottom:7px;z-index:1;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sortable-ghost{opacity:.25}
.sortable-chosen{box-shadow:0 0 0 2px var(--accent)}
img.broken{opacity:0}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line-2);border-radius:var(--r-card);color:var(--muted)}
.empty .ic{margin:0 auto 14px;color:var(--dim)}
.empty b{display:block;color:var(--text);font-family:var(--font-h);font-stretch:75%;font-weight:750;font-size:22px;margin-bottom:6px}
.empty .btn{margin-top:18px}
.tip{display:flex;gap:8px;align-items:flex-start;margin-top:16px;color:var(--dim);font-size:13px}
.tip .ic{margin-top:1px}
body.dragging main{outline:2px dashed var(--accent);outline-offset:-10px;border-radius:20px}

.pprev{border-radius:var(--r-btn);overflow:hidden;background:#050505;margin-bottom:18px;display:grid;place-items:center}
.pprev img{max-width:100%;max-height:44dvh;display:block;object-fit:contain}
.meta{font-size:12px;color:var(--dim);word-break:break-all;margin-top:14px}
.rolebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
@media(min-width:600px){.pick{grid-template-columns:repeat(4,1fr)}}
.pick button{position:relative;aspect-ratio:3/4;border-radius:var(--r-btn);overflow:hidden;border:2px solid transparent;padding:0;background:var(--muted-bg)}
.pick button img{width:100%;height:100%;object-fit:cover;display:block}
.pick button.on{border-color:var(--accent)}
.pick button.on::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#000;font-weight:700;font-size:12px;display:grid;place-items:center}
.photo-field{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--line-2);border-radius:var(--r-btn);margin-bottom:16px}
.photo-field img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:var(--muted-bg);flex:none}
.photo-field .t{flex:1;min-width:0}
.photo-field .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-field .t span{display:block;font-size:12px;color:var(--muted)}

/* ---------- Listen (Ordner, Edits, Pakete) ---------- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.litem{display:flex;gap:14px;align-items:flex-start}
.litem .body{flex:1;min-width:0}
.litem .field{margin-bottom:10px}
.litem .input{min-height:42px;padding:9px 12px}
.lfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lfoot .grow{flex:1}
.fold-ic{flex:none;width:44px;height:44px;border-radius:var(--r-btn);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted)}
.vthumb{flex:none;position:relative;width:84px;aspect-ratio:9/16;border-radius:var(--r-btn);overflow:hidden;background:var(--muted-bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
@media(min-width:640px){.vthumb{width:116px}}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vthumb .plat{position:absolute;left:5px;bottom:5px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 5px;border-radius:4px;background:rgba(0,0,0,.7);color:#fff;line-height:1}
.vurl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-bottom:10px;text-decoration:none}
.vurl:hover{color:var(--text)}

/* ---------- Anfragen ---------- */
.inq-tools{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
@media(min-width:760px){.inq-tools{flex-direction:row;align-items:center}.inq-tools .seg{flex:1}.inq-tools .search{width:280px}}
.search{position:relative}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.search .input{padding-left:40px}
.inq-list{display:flex;flex-direction:column;gap:8px}
.inq{border:1px solid var(--line);border-radius:var(--r-card);background:var(--card);overflow:hidden;transition:border-color var(--ease)}
.inq.open{border-color:var(--line-2)}
.inq.st-neu{border-left:3px solid var(--accent)}
.inq-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;text-align:left}
.avatar{flex:none;width:40px;height:40px;border-radius:var(--r-btn);display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--font-h);font-stretch:75%;font-weight:800;font-size:15px}
.inq-main{flex:1;min-width:0}
.inq-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.inq-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newdot{width:7px;height:7px;border-radius:50%;background:var(--text);flex:none}
.inq-sub{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.inq-body{padding:0 14px 16px}
.msg{margin:0 0 14px;padding:14px;border-radius:var(--r-btn);background:#050505;border:1px solid var(--line);font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.kv{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;font-size:14px}
.kv>div{display:flex;align-items:center;gap:10px;color:var(--muted)}
.kv a,.kv b{color:var(--text);font-weight:500}
.kv a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.kv .ic{color:var(--dim)}
.st-chip.neu{color:var(--text);border-color:var(--text)}.st-chip.neu::before{background:var(--text)}
.st-chip.offen{color:var(--warn);border-color:rgba(251,191,36,.35)}.st-chip.offen::before{background:var(--warn)}
.st-chip.erledigt{color:var(--ok);border-color:rgba(74,222,128,.35)}.st-chip.erledigt::before{background:var(--ok)}
.loading{display:grid;place-items:center;gap:14px;padding:80px 0;color:var(--muted)}

/* ---------- Instagram ---------- */
.thread{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;max-height:56dvh;overflow:auto;padding:2px}
.bub{max-width:82%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.42;white-space:pre-wrap;word-break:break-word}
.bub.them{align-self:flex-start;background:var(--muted-bg);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.bub time{display:block;font-size:11px;opacity:.6;margin-top:3px}
.bub img{max-width:100%;max-height:280px;border-radius:10px;display:block;margin-bottom:4px}
.bub a{color:inherit}
.reply{display:flex;gap:8px;align-items:flex-end}
.reply textarea{min-height:46px;max-height:140px}
.igrow .when{color:var(--muted);font-size:12px;white-space:nowrap}
.inq.new{border-left:3px solid var(--accent)}

/* ---------- Statistik ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r-btn);overflow:hidden;margin-bottom:18px}
.kpis div{background:var(--card);padding:12px 14px}
.kpis b{display:block;font-family:var(--font-h);font-stretch:62%;font-weight:850;font-size:clamp(2rem,7vw,2.6rem);line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.vchart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-bottom:2px;border-bottom:1px solid var(--line-2)}
.vchart i{flex:1;min-width:2px;background:var(--text);border-radius:2px 2px 0 0;opacity:.9;transition:opacity var(--ease)}
.vchart i.zero{background:var(--line-2);height:2px!important;opacity:1}
.vchart i:hover{opacity:1;background:var(--accent)}
.vaxis{display:flex;justify-content:space-between;color:var(--dim);font-size:11.5px;margin:6px 0 20px;font-variant-numeric:tabular-nums}
.sgrid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:760px){.sgrid{grid-template-columns:1fr 1fr}}
.slist{display:flex;flex-direction:column;gap:9px}
.srow{display:grid;grid-template-columns:36px 1fr 34px;align-items:center;gap:10px;font-size:13.5px}
.srow.nothumb{grid-template-columns:1fr 34px}
.srow img{width:36px;height:45px;object-fit:cover;border-radius:5px;background:var(--muted-bg)}
.srow .lbl{min-width:0}
.srow .lbl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .lbl i{display:block;height:4px;border-radius:2px;background:var(--text);margin-top:5px;opacity:.85}
.srow .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.sub-h{font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.topic{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.topic code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:10px 12px;font-size:14px;background:#050505;border:1px solid var(--line-2);border-radius:var(--r-btn)}

/* ---------- Texte & Einstellungen ---------- */
.sec{margin-bottom:16px}
.sec>h2,.sec-h{margin-bottom:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec p.muted{margin:-8px 0 18px;font-size:14px}
.pkgs{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.pkgs{grid-template-columns:repeat(2,1fr)}}
.pkg.hl{border-color:var(--accent)}
.pkg .field{margin-bottom:12px}
.steps{margin:0 0 6px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 38px;color:var(--muted);font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:12.5px}
.steps li b{color:var(--text);font-weight:600}
details.help{margin:0 0 18px;border:1px solid var(--line-2);border-radius:var(--r-btn)}
details.help>summary{padding:13px 14px;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px}
details.help>summary::-webkit-details-marker{display:none}
details.help>summary .ic{transition:transform var(--ease)}
details.help[open]>summary .ic{transform:rotate(90deg)}
details.help>div{padding:4px 14px 8px}
.code{position:relative;margin:10px 0 14px}
.code pre{margin:0;max-height:260px;overflow:auto;padding:14px;border-radius:var(--r-btn);background:#050505;border:1px solid var(--line);font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cbd5e1;white-space:pre}
.code .btn{position:absolute;top:8px;right:8px;background:#000}
.danger{border-color:rgba(239,68,68,.25)}

/* ---------- Als App installieren ---------- */
.apphint{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.apphint>img{width:52px;height:52px;border-radius:12px;flex:none;border:1px solid var(--line-2)}
.apphint .body{flex:1;min-width:0}
.apphint b{display:block;font-weight:600;margin-bottom:2px}
.apphint p{margin:0;color:var(--muted);font-size:13.5px}
.apphint ol{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:13.5px}
.apphint ol li{margin-bottom:4px}
.apphint ol b{display:inline;color:var(--text);margin:0}
.apphint .row-actions{margin-top:12px}

/* ---------- Anmeldung ---------- */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
body.locked .app,body.locked .tabbar,body.locked .pending{display:none!important}
.gate-box{width:100%;max-width:420px;margin:auto 0}
.gate .brand{padding:0;margin-bottom:36px}
.gate h1{font-size:clamp(2.8rem,14vw,4.6rem);margin:10px 0 14px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.gate .lead{color:var(--muted);margin:0 0 26px;font-size:15px}
.gate .err{color:#fca5a5;font-size:14px;min-height:1.4em;margin:-6px 0 14px}
.gate form .btn-primary{width:100%}
.gate details.help{margin-top:-6px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:0 0 20px}
.check input{width:20px;height:20px;margin:0;accent-color:#fff}
.textlink{display:inline-block;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;margin-top:18px;padding:10px 0;min-height:44px}
.textlink:hover{color:var(--text)}

/* ---------- Leiste für ungespeicherte Änderungen ---------- */
.pending{position:fixed;z-index:29;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));display:none;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:var(--r-card);background:rgba(12,12,12,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-2);box-shadow:0 20px 50px -10px rgba(0,0,0,.9);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.pending.show{display:flex}
.pending .t{flex:1;min-width:0;font-size:13.5px}
.pending .t b{display:block;font-weight:600}
.pending .t span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:960px){.pending{left:auto;right:28px;bottom:28px;width:480px}}

/* ---------- Dialog ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.open{display:block}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--card);border:1px solid var(--line-2);border-bottom:0;border-radius:var(--r-modal) var(--r-modal) 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}
@media(min-width:700px){
  .sheet{left:50%;top:50%;bottom:auto;width:min(580px,92vw);max-height:88dvh;transform:translate(-50%,-50%);border-radius:var(--r-modal);border-bottom:1px solid var(--line-2);padding:28px;box-shadow:var(--shadow-xl);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
  .sheet::before{display:none}
}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.sheet-h h3{margin:0;font-family:var(--font-h);font-stretch:75%;font-weight:800;font-size:26px;line-height:1.05}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet-actions .grow{flex:1}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translate(-50%,-47%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
@keyframes fade{from{opacity:0}}

/* ---------- Meldungen ---------- */
.toasts{position:fixed;z-index:80;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 24px));pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r-btn);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;box-shadow:var(--shadow-xl);animation:drop .25s ease}
.toast.bad{background:#2a0b0b;color:#fecaca;border:1px solid rgba(239,68,68,.5)}
.toast.warn{background:#1f1706;color:#fde68a;border:1px solid rgba(251,191,36,.4)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.progress{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.progress.show{display:grid}
.prog-card{width:min(340px,86vw);padding:26px 22px;border-radius:var(--r-modal);background:var(--card);border:1px solid var(--line-2);text-align:center}
.ring{width:42px;height:42px;margin:0 auto 18px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--text);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-t{font-size:14.5px;margin-bottom:16px}
.pbar{height:3px;border-radius:2px;background:var(--line-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--text);transition:width .3s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

</div>
<nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>

<div class="progress" id="progress"></div>
<div class="gate" id="gate" hidden></div>

<input type="file" id="coverInput" accept="image/*" hidden>

/* ---------- Base64 ---------- */
function bytesToB64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
const utf8ToB64 = str => bytesToB64(new TextEncoder().encode(str));
function b64ToUtf8(b64) { const bin = atob(String(b64).replace(/\s/g, '')); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }
const blobToB64 = async blob => bytesToB64(new Uint8Array(await blob.arrayBuffer()));
const encPath = p => p.split('/').map(encodeURIComponent).join('/');

/* =====================================================================
   GitHub
   ===================================================================== */
const GH = {
  get known() { return !!(cfg.gh.owner && cfg.gh.repo); },
  get ready() { return this.known && !!cfg.gh.token; },
  base() { return `https://api.github.com/repos/${encodeURIComponent(cfg.gh.owner)}/${encodeURIComponent(cfg.gh.repo)}`; },
  raw(path) { return `https://raw.githubusercontent.com/${encodeURIComponent(cfg.gh.owner)}/${encodeURIComponent(cfg.gh.repo)}/${encPath(cfg.gh.branch || 'main')}/${encPath(path)}`; },
  async req(path, opts = {}) {
    const headers = { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cfg.gh.token, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) };
    const res = await fetch(this.base() + path, { ...opts, headers, cache: 'no-store' });
    if (!res.ok) { let msg = 'HTTP ' + res.status; try { const j = await res.json(); if (j.message) msg = j.message; } catch {} const e = new Error(msg); e.status = res.status; throw e; }
    return res.status === 204 ? null : res.json();
  },
  repoInfo() { return this.req(''); },
  async file(path) {
    try { return await this.req(`/contents/${encPath(path)}?ref=${encodeURIComponent(cfg.gh.branch)}`); }
    catch (e) { if (e.status === 404) return null; throw e; }
  },
  async text(meta) {
    if (meta.content) return b64ToUtf8(meta.content);
    const blob = await this.req(`/git/blobs/${meta.sha}`); return b64ToUtf8(blob.content);
  },
  async readContent() {
    const meta = await this.file('content.json');
    if (!meta) return { data: null, sha: null };
    return { data: JSON.parse(await this.text(meta)), sha: meta.sha };
  },
  async head() {
    const ref = await this.req(`/git/ref/heads/${encPath(cfg.gh.branch)}`);
    const commit = await this.req(`/git/commits/${ref.object.sha}`);
    return { sha: ref.object.sha, tree: commit.tree.sha };
  },
  /* Alles als EIN Commit: Fotos + content.json + Löschungen */
  async commit(files, deletes, message, onProgress) {
    const h = await this.head();
    let del = [...deletes];
    if (del.length) {
      const t = await this.req(`/git/trees/${h.tree}?recursive=1`);
      const existing = new Set(arr(t.tree).map(x => x.path));
      del = del.filter(p => existing.has(p));
      /* Dateien, die index.html direkt verwendet (z. B. Vorschaubild für Links), bleiben liegen */
      try { const idx = await this.file('index.html'); if (idx) { const html = await this.text(idx); del = del.filter(p => !html.includes(p)); } } catch {}
    }
    const entries = [];
    for (let i = 0; i < files.length; i++) {
      onProgress?.(files.length > 1 ? `Lade hoch … ${i + 1} von ${files.length}` : 'Lade hoch …', (i + 1) / (files.length + 2));
      const blob = await this.req('/git/blobs', { method: 'POST', body: JSON.stringify({ content: files[i].b64, encoding: 'base64' }) });
      entries.push({ path: files[i].path, mode: '100644', type: 'blob', sha: blob.sha });
    }
    for (const p of del) entries.push({ path: p, mode: '100644', type: 'blob', sha: null });
    onProgress?.('Speichere …', (files.length + 1) / (files.length + 2));
    const tree = await this.req('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: h.tree, tree: entries }) });
    const commit = await this.req('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: tree.sha, parents: [h.sha] }) });
    await this.req(`/git/refs/heads/${encPath(cfg.gh.branch)}`, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) });
    return commit;
  }
};
function ghError(e) {
  if (e.status === 401) return 'Token ungültig oder abgelaufen.';
  if (e.status === 403) return 'Kein Zugriff – der Token braucht „Contents: Read and write“ für dieses Repo.';
  if (e.status === 404) return 'Repo nicht gefunden (oder der Token hat keinen Zugriff darauf).';
  if (e.status === 409) return 'Das Repo ist gerade gesperrt oder leer.';
  if (e.status === 422) return 'GitHub hat die Änderung abgelehnt: ' + e.message;
  if (e instanceof TypeError) return 'Keine Verbindung zu GitHub. Bist du online?';
  return e.message || 'Unbekannter Fehler';
}

/* =====================================================================
   Anmeldung mit Passwort
   Der GitHub-Token (und der Postfach-Zugang) liegen verschlüsselt in
   admin-key.json im Repo: AES-GCM, Schlüssel aus dem Passwort per
   PBKDF2-SHA256 (600 000 Runden). Ohne Passwort ist die Datei nutzlos.
   ===================================================================== */
const KEYFILE = 'admin-key.json', ITER = 600000;
const b64d = s => { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; };
const sess = {
  get(k) { try { const v = sessionStorage.getItem('mapq_admin_' + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem('mapq_admin_' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { sessionStorage.removeItem('mapq_admin_' + k); } catch {} }
};
async function deriveRaw(password, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, 256));
}
const aesKey = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function sealVault(vault, raw, salt, iter) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aesKey(raw), new TextEncoder().encode(JSON.stringify(vault)));
  return { v: 1, info: 'Verschlüsselter Zugang für admin.html – nicht löschen oder ändern.', kdf: 'PBKDF2-SHA256', iter, salt: bytesToB64(salt), iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(ct)) };
}
async function openVault(file, password) {
  const salt = b64d(file.salt), raw = await deriveRaw(password, salt, file.iter || ITER);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(file.iv) }, await aesKey(raw), b64d(file.data));
  return { vault: JSON.parse(new TextDecoder().decode(pt)), raw, salt, iter: file.iter || ITER };
}
/* Liest admin-key.json: null = gibt es nicht, undefined = keine Verbindung */
async function fetchKeyFile() {
  try {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.gh.owner)}/${encodeURIComponent(cfg.gh.repo)}/contents/${KEYFILE}?ref=${encodeURIComponent(cfg.gh.branch)}`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (r.status === 404) return null;
    if (r.ok) { const j = await r.json(); return JSON.parse(b64ToUtf8(j.content)); }
  } catch {}
  let missing = 0;
  const urls = [GH.raw(KEYFILE)];
  if (/^https?:$/.test(location.protocol)) urls.unshift(KEYFILE);
  for (const u of urls) {
    try { const r = await fetch(u, { cache: 'no-cache' }); if (r.status === 404) { missing++; continue; } if (r.ok) return await r.json(); } catch {}
  }
  return missing === urls.length ? null : undefined;
}
const AUTH = {
  s: null, // { token, vault, raw, salt, iter, keep }
  load() {
    this.s = store.get('auth') || sess.get('auth');
    if (!this.s && cfg.gh.token) this.s = { token: cfg.gh.token, vault: { token: cfg.gh.token }, keep: true }; // älterer Stand ohne Passwort
    this.save();
  },
  save() {
    store.del('auth'); sess.del('auth');
    if (this.s) (this.s.keep ? store : sess).set('auth', this.s);
    cfg.gh.token = this.s?.token || '';
    store.set('gh', { ...cfg.gh, token: '' });
  },
  clear() { this.s = null; this.save(); },
  get hasKey() { return !!(this.s && this.s.raw); }
};
/* Tresor neu verschlüsseln und als eigener Commit speichern */
async function saveVault(patch, newPassword, message) {
  let raw = AUTH.s?.raw ? b64d(AUTH.s.raw) : null, salt = AUTH.s?.salt ? b64d(AUTH.s.salt) : null, iter = AUTH.s?.iter || ITER;
  if (newPassword) { salt = crypto.getRandomValues(new Uint8Array(16)); raw = await deriveRaw(newPassword, salt, ITER); iter = ITER; }
  if (!raw) throw new Error('Lege zuerst ein Passwort fest.');
  const vault = { ...(AUTH.s?.vault || {}), ...patch };
  const file = await sealVault(vault, raw, salt, iter);
  await GH.commit([{ path: KEYFILE, b64: utf8ToB64(JSON.stringify(file, null, 2) + '\n') }], [], message);
  state.keyFile = file;
  AUTH.s = { ...(AUTH.s || { keep: true }), vault, token: vault.token, raw: bytesToB64(raw), salt: bytesToB64(salt), iter };
  AUTH.save();
}

  if ((m = u.match(/instagram\.com\/(?:reels?|p)\/([\w-]+)/))) return { url: u, platform: 'instagram', videoId: m[1], short: false };

async function loadBitmap(file) {

  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);

async function resize(src, max, quality) {
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
  const s = Math.min(1, max / Math.max(w, h)), cw = Math.round(w * s), ch = Math.round(h * s);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, cw, ch);
  const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Export fehlgeschlagen')), 'image/jpeg', quality));
  return { blob, w: cw, h: ch };
}

const extrasSql = topic => `-- Zusatzfunktionen für mapq.at: Besucherstatistik + Push bei neuer Anfrage
-- (kann gefahrlos mehrmals ausgeführt werden)

-- 1) Besucherstatistik: keine IP, keine Cookies
create table if not exists public.besuche (
  id uuid primary key default gen_random_uuid(),
  zeit timestamptz not null default now(),
  art text not null check (art in ('seite', 'foto')),
  ziel text check (char_length(ziel) <= 120),
  quelle text check (char_length(quelle) <= 120),
  geraet text check (geraet in ('handy', 'tablet', 'computer'))
);
create index if not exists besuche_zeit on public.besuche (zeit);
alter table public.besuche enable row level security;
drop policy if exists "website_zaehlt" on public.besuche;
create policy "website_zaehlt" on public.besuche for insert to anon
  with check (zeit > now() - interval '5 minutes' and zeit < now() + interval '5 minutes');
revoke all on public.besuche from anon, authenticated;
grant insert on public.besuche to anon;

create or replace function public.mapq_statistik(tage int default 30)
returns jsonb language plpgsql stable security definer set search_path = ''
as $$
declare
  heute date := (now() at time zone 'Europe/Vienna')::date;
  ab timestamptz := (heute - (tage - 1))::timestamp at time zone 'Europe/Vienna';
begin
  if not public.mapq_ist_admin() then raise exception 'Kein Zugriff'; end if;
  return jsonb_build_object(
    'heute', (select count(*) from public.besuche where art = 'seite' and zeit >= heute::timestamp at time zone 'Europe/Vienna'),
    'woche', (select count(*) from public.besuche where art = 'seite' and zeit >= (heute - 6)::timestamp at time zone 'Europe/Vienna'),
    'monat', (select count(*) from public.besuche where art = 'seite' and zeit >= ab),
    'tage', (select coalesce(jsonb_agg(jsonb_build_object('tag', t.tag::date, 'n', coalesce(z.n, 0)) order by t.tag), '[]'::jsonb)
             from generate_series(heute - (tage - 1), heute, interval '1 day') as t(tag)
             left join (select (zeit at time zone 'Europe/Vienna')::date as tag, count(*) as n
                        from public.besuche where art = 'seite' and zeit >= ab group by 1) z on z.tag = t.tag::date),
    'fotos', (select coalesce(jsonb_agg(jsonb_build_object('f', ziel, 'n', n)), '[]'::jsonb)
              from (select ziel, count(*) as n from public.besuche
                    where art = 'foto' and zeit >= ab and ziel is not null
                    group by ziel order by n desc limit 8) x),
    'quellen', (select coalesce(jsonb_agg(jsonb_build_object('q', q, 'n', n)), '[]'::jsonb)
                from (select coalesce(quelle, '') as q, count(*) as n from public.besuche
                      where art = 'seite' and zeit >= ab group by 1 order by n desc limit 8) x),
    'geraete', (select coalesce(jsonb_object_agg(coalesce(geraet, '?'), n), '{}'::jsonb)
                from (select geraet, count(*) as n from public.besuche
                      where art = 'seite' and zeit >= ab group by 1) x)
  );
end $$;
revoke all on function public.mapq_statistik(int) from public, anon;
grant execute on function public.mapq_statistik(int) to authenticated;

-- 2) Push bei neuer Anfrage (über ntfy.sh)
create extension if not exists pg_net;
create table if not exists public.mapq_einstellungen (schluessel text primary key, wert text not null);
alter table public.mapq_einstellungen enable row level security;
revoke all on public.mapq_einstellungen from anon, authenticated;
insert into public.mapq_einstellungen (schluessel, wert)
  values ('push_thema', '${topic}') on conflict (schluessel) do nothing;

create or replace function public.mapq_push_topic()
returns text language sql stable security definer set search_path = ''
as $$ select case when public.mapq_ist_admin()
  then (select wert from public.mapq_einstellungen where schluessel = 'push_thema') end $$;
revoke all on function public.mapq_push_topic() from public, anon;
grant execute on function public.mapq_push_topic() to authenticated;

create or replace function public.mapq_push_anfrage()
returns trigger language plpgsql security definer set search_path = ''
as $$
declare thema text;
begin
  select wert into thema from public.mapq_einstellungen where schluessel = 'push_thema';
  if thema is not null then
    perform net.http_post(
      url := 'https://ntfy.sh',
      body := jsonb_build_object(
        'topic', thema,
        'title', 'Neue Anfrage auf mapq.at',
        'message', split_part(new.name, ' ', 1) || coalesce(' · ' || new.art, ''),
        'tags', jsonb_build_array('camera'),
        'priority', 4,
        'click', 'https://mapq.at/admin.html#inquiries'
      )
    );
  end if;
  return new;
exception when others then
  return new; -- ein Push-Fehler darf nie eine Anfrage verhindern
end $$;
drop trigger if exists mapq_push on public.anfragen;
create trigger mapq_push after insert on public.anfragen
  for each row execute function public.mapq_push_anfrage();`;

const sqlFor = () => `-- Anfragen von mapq.at (kann gefahrlos mehrmals ausgeführt werden)
create table if not exists public.anfragen (
  id uuid primary key default gen_random_uuid(),
  created_at timestamptz not null default now(),
  name text not null check (char_length(name) between 1 and 120),
  kontakt text not null check (char_length(kontakt) between 3 and 200),
  art text check (char_length(art) <= 80),
  zeit text check (char_length(zeit) <= 80),
  nachricht text check (char_length(nachricht) <= 4000),
  status text not null default 'neu',
  notiz text
);
alter table public.anfragen enable row level security;

-- Admin = der erste Benutzer, den du unter Authentication anlegst
create or replace function public.mapq_ist_admin()
returns boolean language sql stable security definer set search_path = ''
as $$
  select auth.uid() is not null
     and auth.uid() = (select id from auth.users order by created_at limit 1);
$$;
revoke all on function public.mapq_ist_admin() from public, anon;
grant execute on function public.mapq_ist_admin() to authenticated;

-- Die Website darf Anfragen nur EINTRAGEN, nicht lesen
drop policy if exists "website_insert" on public.anfragen;
create policy "website_insert" on public.anfragen
  for insert to anon with check (status = 'neu' and notiz is null);

-- Nur du darfst lesen, bearbeiten und löschen
drop policy if exists "admin_all" on public.anfragen;
create policy "admin_all" on public.anfragen
  for all to authenticated
  using (public.mapq_ist_admin()) with check (public.mapq_ist_admin());

grant insert on public.anfragen to anon;
grant select, insert, update, delete on public.anfragen to authenticated;`;

};

function afterRender() {

      onEnd: e => { if (e.oldIndex !== e.newIndex) reorderFromDom(); }
    });

}
function reorderFromDom() {
  const ids = $$('#pgrid .ptile').map(el => el.dataset.id), all = state.content.photos;
  const slots = all.map((p, i) => ids.includes(p.f) ? i : -1).filter(i => i >= 0);

  ids.forEach((f, k) => { all[slots[k]] = by[f]; });
  updateDirty();
}

/* =====================================================================
   Laden & Veröffentlichen
   ===================================================================== */
function resetPending() { state.previews.forEach(u => URL.revokeObjectURL(u)); state.previews.clear(); state.uploads.clear(); state.deletes.clear(); }
async function loadView() {
  state.mode = 'view'; state.loadError = null; state.contentMissing = false; state.contentSha = null;
  resetPending();
  let data = null;
  const tries = [];
  if (/^https?:$/.test(location.protocol) && !/^(raw\.githubusercontent|.*claude)/.test(location.hostname)) tries.push('content.json');
  if (GH.known) tries.push(GH.raw('content.json'));
  for (const u of tries) { try { const r = await fetch(u, { cache: 'no-cache' }); if (r.ok) { data = await r.json(); break; } } catch {} }
  state.source = data ? 'repo' : 'fallback';
  state.content = normalize(data || fallbackContent());
  state.originalJSON = JSON.stringify(state.content);
  if (inqMode() === 'demo') state.inquiries = demoInquiries();
}
async function loadLive() {
  state.mode = 'live'; state.loading = true; render();
  try {
    const { data, sha } = await GH.readContent();
    state.content = normalize(data || fallbackContent());
    state.contentSha = sha; state.contentMissing = !data;
    state.originalJSON = data ? JSON.stringify(state.content) : '';
    state.loadError = null; state.source = 'repo';
  } catch (e) {
    state.loadError = ghError(e);
    state.content = normalize(fallbackContent());
    state.originalJSON = JSON.stringify(state.content);
  }
  state.loading = false;
}
async function publish() {
  if (state.mode !== 'live') { toast('Verbinde zuerst GitHub – dann geht’s live.', 'warn'); go('settings'); return; }
  if (state.loadError) { toast('Erst die GitHub-Verbindung reparieren.', 'bad'); go('settings'); return; }
  if (!isDirty()) { toast('Alles ist schon online.', 'ok'); return; }
  const s = state.content.site;
  if (!photoByF(s.heroPhoto) || !photoByF(s.aboutPhoto)) { toast('Bitte zuerst ein Titelbild und ein Über-mich-Bild wählen.', 'warn'); go('texts'); return; }
  const summary = changeSummary();
  showProgress('Prüfe …');
  try {
    const meta = await GH.file('content.json');
    if ((meta ? meta.sha : null) !== state.contentSha) {
      hideProgress();
      if (!confirm('content.json wurde inzwischen auf GitHub geändert (z. B. von einem anderen Gerät).\n\nMit deiner Version überschreiben?')) return;
      showProgress('Veröffentliche …');
    }
    state.content.updatedAt = new Date().toISOString();
    const files = [...state.uploads].map(([path, u]) => ({ path, b64: u.b64 }));
    files.push({ path: 'content.json', b64: utf8ToB64(JSON.stringify(state.content, null, 2) + '\n') });
    await GH.commit(files, state.deletes, 'Admin: ' + (summary.join(', ') || 'Inhalte aktualisiert'), setProgress);
    setProgress('Fertig!', 1);
    const m = await GH.file('content.json');
    state.contentSha = m ? m.sha : null;
    state.uploads.clear(); state.deletes.clear();
    state.originalJSON = JSON.stringify(state.content); state.contentMissing = false;
    store.set('lastPublish', Date.now());
    hideProgress(); render();
    toast('Veröffentlicht! In ca. 1 Minute auf mapq.at.', 'ok');
  } catch (e) { hideProgress(); toast('Veröffentlichen fehlgeschlagen: ' + ghError(e), 'bad'); }
}
function discard() {
  if (!confirm('Alle Änderungen seit dem letzten Veröffentlichen verwerfen?')) return;
  resetPending();
  state.content = state.originalJSON ? normalize(JSON.parse(state.originalJSON)) : normalize(fallbackContent());
  toast('Änderungen verworfen.'); render();
}

/* ---------- Fotos ---------- */
async function processFiles(files) {
  const list = [...files].filter(f => (f.type || '').startsWith('image/') || /\.(jpe?g|png|webp|heic|heif|avif)$/i.test(f.name));
  if (!list.length) return;
  const cat = CATS.some(c => c.id === state.photoFilter) ? state.photoFilter : 'auto';
  const added = [];
  showProgress('Bereite Fotos vor …');
  for (let i = 0; i < list.length; i++) {
    const file = list[i];
    setProgress(`Optimiere Foto ${i + 1} von ${list.length} …`, i / list.length);
    try {
      const bmp = await loadBitmap(file);
      const big = await resize(bmp, cfg.img.max, cfg.img.q);
      const small = await resize(bmp, SMALL_EDGE, 0.8);
      if (bmp.close) bmp.close();
      let f = (slug(file.name.replace(/\.[^.]+$/, '')) || 'foto') + '-' + uid().slice(-4);
      while (photoByF(f)) f += 'x';
      state.uploads.set(BIG(f), { b64: await blobToB64(big.blob) });
      state.uploads.set(SMALL(f), { b64: await blobToB64(small.blob) });
      state.previews.set(BIG(f), URL.createObjectURL(big.blob));
      state.previews.set(SMALL(f), URL.createObjectURL(small.blob));
      added.push({ f, t: niceTitle(file.name), c: [cat], ar: Math.round(big.w / big.h * 10000) / 10000, hl: false });
    } catch (err) { console.error(err); toast(`„${file.name}“ konnte nicht gelesen werden.`, 'bad'); }
  }
  hideProgress();
  if (!added.length) return;
  state.content.photos.unshift(...added);
  state.view = 'photos'; render();
  toast(`${added.length} Foto${added.length > 1 ? 's' : ''} hinzugefügt – Beschreibung und Kategorie per Tippen anpassen.`, 'ok');
}
function removePhoto(f) {
  const s = state.content.site;
  if (s.heroPhoto === f) { toast('Das ist gerade dein Titelbild – wähle unter „Texte“ zuerst ein anderes.', 'warn'); return false; }
  if (s.aboutPhoto === f) { toast('Das ist gerade dein Über-mich-Bild – wähle unter „Texte“ zuerst ein anderes.', 'warn'); return false; }
  const list = state.content.photos, i = list.findIndex(p => p.f === f); if (i < 0) return false;
  dropFile(BIG(f)); dropFile(SMALL(f)); list.splice(i, 1);
  return true;
}

/* ---------- Ordner & Edits ---------- */
function addFolder() {
  const t = $('#fT').value.trim(), d = $('#fD').value, raw = $('#fU').value.trim();
  if (!t) { toast('Gib dem Ordner einen Namen.', 'warn'); $('#fT').focus(); return; }
  const url = /^https?:\/\//i.test(raw) ? raw : raw ? 'https://' + raw : '';
  try { new URL(url); } catch { toast('Füg den Link zum Ordner ein.', 'warn'); $('#fU').focus(); return; }
  state.content.folders.unshift({ id: 'f_' + uid(), t, d, url });
  renderView(); updateDirty(); toast('Ordner hinzugefügt.', 'ok');
}
async function addVideo() {
  const inp = $('#videoUrl'), raw = (inp?.value || '').trim();
  if (!raw) { toast('Füg zuerst einen Link ein.', 'warn'); inp?.focus(); return; }
  const url = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
  try { new URL(url); } catch { toast('Das sieht nicht nach einem Link aus.', 'bad'); return; }
  if (state.content.videos.some(v => v.url === url)) { toast('Dieses Video ist schon drin.', 'warn'); return; }
  const v = { id: 'v_' + uid(), title: '', car: '', cover: '', ...parseVideo(url) };
  state.content.videos.unshift(v);
  renderView(); updateDirty();
  toast(v.short ? 'Hinzugefügt – bitte aber den vollen Link verwenden.' : 'Video hinzugefügt.', v.short ? 'warn' : 'ok');
  if (v.platform === 'tiktok' && v.videoId) {
    try { const r = await fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(url)); if (r.ok) { const j = await r.json(); if (j.title && !v.title) { v.title = j.title.slice(0, 80); if (state.view === 'videos') renderView(); updateDirty(); } } } catch {}
  }
}
async function setVideoCover(file) {
  const v = byKey('videos', state.coverTarget); state.coverTarget = null;
  if (!v || !file) return;
  showProgress('Bereite Cover vor …');
  try {
    const bmp = await loadBitmap(file), r = await resize(bmp, 1280, 0.8); if (bmp.close) bmp.close();
    if (v.cover) dropFile(v.cover);
    const path = `fotos/edits/${v.id}-${uid().slice(-4)}.jpg`;

/* ---------- Anfragen ---------- */
async function loadInquiries(quiet) {
  if (inqMode() !== 'live') return;
  state.inqLoading = true;
  if (!quiet && state.view === 'inquiries') renderView();
  try { state.inquiries = (await SB.list()) || []; state.inqError = null; }
  catch (e) { state.inqError = e.message; if (!SB.loggedIn) state.inquiries = []; }
  state.inqLoading = false;
  renderChrome();
  if (['inquiries', 'dashboard'].includes(state.view) && !$('#sheetWrap').classList.contains('open')) renderView();
}
async function patchInquiry(id, patch, okMsg) {
  const q = inqById(id); if (!q) return;
  const prev = { ...q }; Object.assign(q, patch);
  renderChrome(); if (state.view === 'inquiries') renderView();
  if (inqMode() !== 'live') return;
  try { await SB.update(q.id, patch); if (okMsg) toast(okMsg, 'ok'); }
  catch (e) { Object.assign(q, prev); renderChrome(); if (state.view === 'inquiries') renderView(); toast('Speichern fehlgeschlagen: ' + e.message, 'bad'); }
}
async function deleteInquiry(id) {
  const q = inqById(id); if (!q || !confirm(`Anfrage von ${q.name} endgültig löschen?`)) return;
  if (inqMode() === 'live') { try { await SB.remove(q.id); } catch (e) { toast('Löschen fehlgeschlagen: ' + e.message, 'bad'); return; } }
  state.inquiries = state.inquiries.filter(x => x !== q);
  renderChrome(); renderView(); toast('Anfrage gelöscht.');
}

/* ---------- Einstellungen ---------- */
async function saveRepo() {
  const owner = $('#ghOwner').value.trim().replace(/^@/, '');
  const repo = $('#ghRepo').value.trim().replace(/^.*github\.com\/[^/]+\//, '').replace(/\.git$/, '');
  const branch = $('#ghBranch').value.trim() || 'main', site = $('#siteUrl').value.trim();
  if (!owner || !repo) { toast('GitHub-Name und Repository ausfüllen.', 'warn'); return; }
  if (isDirty() && !confirm('Nicht veröffentlichte Änderungen gehen beim Neuladen verloren. Weiter?')) return;
  const prev = { ...cfg.gh };
  cfg.gh = { ...cfg.gh, owner, repo, branch };
  showProgress('Prüfe …');
  try {
    const info = await GH.repoInfo();
    try { await GH.req(`/git/ref/heads/${encPath(branch)}`); }
    catch (e) { if (e.status === 404) throw new Error(`Den Branch „${branch}“ gibt es nicht (Standard ist „${info.default_branch}“).`); throw e; }
    cfg.gh.owner = info.owner?.login || owner; cfg.gh.repo = info.name || repo;
    AUTH.save(); cfg.siteUrl = site; store.set('siteUrl', site);
    hideProgress(); resetPending(); await loadLive(); render(); toast('Gespeichert.', 'ok');
  } catch (e) { cfg.gh = prev; hideProgress(); toast(e.status ? ghError(e) : (e.message || ghError(e)), 'bad'); }
}
function readSb() {
  return {
    url: ($('#sbUrl')?.value || '').trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, ''),
    key: ($('#sbKey')?.value || '').trim(),
    email: ($('#sbEmail')?.value || cfg.sb.email || '').trim()
  };
}
function checkSb(s) {
  if (!/^https:\/\/[^/]+$/.test(s.url)) { toast('Die Project URL sieht so aus: https://xxxx.supabase.co', 'warn'); return false; }
  if (!s.key) { toast('Bitte den publishable/anon Key einfügen.', 'warn'); return false; }
  if (isSecretKey(s.key)) { toast('Das ist der geheime Key – bitte den publishable/anon Key nehmen.', 'bad'); return false; }
  return true;
}
async function sbLogin() {
  const s = readSb(), pass = $('#sbPass')?.value || '';
  if (!checkSb(s)) return;
  if (!s.email || !pass) { toast('E-Mail und Passwort ausfüllen.', 'warn'); return; }
  cfg.sb = s; store.set('sb', s);
  showProgress('Melde an …');
  try {
    await SB.login(s.email, pass);
    /* Postfach-Zugang mit dem Admin-Passwort verschlüsselt speichern – dann klappt es auf jedem Gerät automatisch */
    if (AUTH.hasKey) {
      setProgress('Speichere Zugang …', .5);
      try { await saveVault({ sb: { url: s.url, key: s.key, email: s.email, password: pass } }, null, 'Admin: Postfach-Zugang gespeichert'); }
      catch (e) { toast('Postfach verbunden, aber nicht für andere Geräte gespeichert: ' + ghError(e), 'warn'); }
    }
    setProgress('Lade Anfragen …', .7);
    state.inquiries = [];
    await loadInquiries(true); loadExtras(); loadStats();
    hideProgress(); render();
    toast(state.inqError || 'Postfach verbunden.', state.inqError ? 'bad' : 'ok');
  } catch (e) {
    hideProgress();
    toast(/invalid login/i.test(e.message) ? 'E-Mail oder Passwort falsch.' : e instanceof TypeError ? 'Supabase nicht erreichbar – stimmt die Project URL?' : e.message, 'bad');
  }
}

document.addEventListener('click', e => {

  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }

function onBind(el) {
  if (!state.content) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.bind) setPath(state.content, el.dataset.bind, val);
  else if (el.dataset.list) {
    const item = byKey(el.dataset.list, el.dataset.id); if (!item) return;
    const f = el.dataset.field;
    item[f] = f === 'features' ? val.split('\n').map(s => s.trim()).filter(Boolean) : val;
    if (el.dataset.list === 'packages' && f === 'highlight') el.closest('.pkg')?.classList.toggle('hl', val);
  }
  updateDirty();
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-bind],[data-list]') && t.type !== 'checkbox') onBind(t);
  else if (t.id === 'inqSearch') { state.inqQuery = t.value; const l = $('#inqList'); if (l) l.innerHTML = inqListHTML(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-bind],[data-list]')) onBind(t);
  else if (t.dataset.inqNote) { const q = inqById(t.dataset.inqNote); if (q && (q.notiz || '') !== t.value) patchInquiry(q.id, { notiz: t.value }, 'Notiz gespeichert.'); }
  else if (t.dataset.cfg) { cfg.img[t.dataset.cfg] = Number(t.value); store.set('img', cfg.img); toast('Gespeichert.', 'ok'); }
  else if (t.id === 'sbEmail') { cfg.sb.email = t.value.trim(); store.set('sb', cfg.sb); }
  else if (t.id === 'statsSwitch') {
    if (t.checked) state.content.stats = true; else delete state.content.stats;
    updateDirty(); renderView();
    toast(t.checked ? 'Wird mit dem nächsten Veröffentlichen aktiv.' : 'Statistik wird mit dem nächsten Veröffentlichen ausgeschaltet.');
  }
  else if (t.id === 'inboxSwitch') {
    if (t.checked) {
      const s = readSb(); if (!checkSb(s)) { t.checked = false; return; }
      cfg.sb = { ...cfg.sb, ...s }; store.set('sb', cfg.sb);
      state.content.inbox = { url: s.url, key: s.key };
    } else state.content.inbox = null;
    updateDirty(); renderView();
    toast(state.mode === 'live' ? 'Wird mit dem nächsten Veröffentlichen aktiv.' : 'Zum Speichern GitHub verbinden.');

});

$('#fileInput').addEventListener('change', e => { processFiles(e.target.files); e.target.value = ''; });
$('#coverInput').addEventListener('change', e => { setVideoCover(e.target.files[0]); e.target.value = ''; });
document.addEventListener('error', e => {
  const img = e.target; if (img.tagName !== 'IMG') return;
  if (img.dataset.fallback && !img.dataset.fb && img.src !== img.dataset.fallback) { img.dataset.fb = '1'; img.src = img.dataset.fallback; }
  else img.classList.add('broken');
}, true);

/* Fotos per Drag & Drop (am Computer) */
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragDepth++; document.body.classList.add('dragging'); });
document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); processFiles(e.dataTransfer.files); });

window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== state.view && NAV.some(n => n.id === v)) go(v); });
document.addEventListener('visibilitychange', () => { if (document.hidden || !state.content) return; if (inqMode() === 'live') { loadInquiries(true); loadStats(); } if (IG.ready) igLoad(true); });

/* =====================================================================
   Start
   ===================================================================== */
document.addEventListener('submit', e => {
  if (e.target.id !== 'gForm') return;
  e.preventDefault();
  if (e.target.dataset.gate === 'login') doUnlock(); else doSetup();
});

(async function init() {
  store.set('notrack', true);
  const h = location.hash.slice(1);
  if (NAV.some(n => n.id === h)) state.view = h;
  AUTH.load();
  if (GH.ready) {
    await loadLive(); render();
    if (inqMode() === 'live') { loadInquiries(); loadExtras(); loadStats(); }
    if (IG.ready) { igLoad(true); igMaybeRefresh(); }
  } else await checkGate();
  if (!window.Sortable) window.addEventListener('load', () => { if (window.Sortable && state.view === 'photos' && !$('#sheetWrap').classList.contains('open')) renderView(); }, { once: true });
})();
</script>
</body>
